<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAT Countdown</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23C4302B'>⏱</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --porsche-black: #000000;
            --porsche-white: #ffffff;
            --porsche-red: #C4302B;
            --porsche-light-gray: #f5f5f5;
            --porsche-medium-gray: #e0e0e0;
            --porsche-dark-gray: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--porsche-black) 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .card {
            background: var(--porsche-white);
            border-radius: 8px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 50px;
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            color: var(--porsche-black);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--porsche-dark-gray);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .countdown-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-unit {
            background: var(--porsche-light-gray);
            border-radius: 8px;
            padding: 30px 20px;
            transition: all 0.3s ease;
        }

        .time-unit:hover {
            background: var(--porsche-medium-gray);
            transform: translateY(-5px);
        }

        .time-value {
            font-size: 56px;
            font-weight: 700;
            color: var(--porsche-red);
            line-height: 1;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .time-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--porsche-dark-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .target-date {
            font-size: 14px;
            color: var(--porsche-dark-gray);
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--porsche-medium-gray);
        }

        .target-date strong {
            color: var(--porsche-red);
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }

            .title {
                font-size: 36px;
            }

            .countdown-display {
                gap: 15px;
            }

            .time-value {
                font-size: 42px;
            }

            .time-label {
                font-size: 12px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1 class="title">⏱ GAT Countdown</h1>
                <p class="subtitle">Gemeinsam auf das Ziel hinarbeiten</p>
            </div>

            <div class="countdown-display">
                <div class="time-unit">
                    <div class="time-value" id="days">0</div>
                    <div class="time-label">Tage</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="hours">0</div>
                    <div class="time-label">Stunden</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="minutes">0</div>
                    <div class="time-label">Minuten</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="seconds">0</div>
                    <div class="time-label">Sekunden</div>
                </div>
            </div>

            <div class="target-date">
                Ziel: <strong>01. März 2031 um 08:00 Uhr</strong> (Deutscher Zeit)
            </div>
        </div>
    </div>

    <script>
        // Zieldatum: 01.03.2031 08:00 Uhr CET/CEST
        const targetDate = new Date('2031-03-01T08:00:00+01:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                // Ziel erreicht
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                return;
            }

            // Berechnung
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Führende Nullen
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Sofort aktualisieren
        updateCountdown();

        // Jede Sekunde aktualisieren
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
